[package]
name = "gdfmt_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line GDScript formatter with validated output"
readme = "README.md"
keywords = ["gdscript", "godot", "formatter", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
gdfmt.workspace = true
gdfmt_text.workspace = true
gdfmt_config.workspace = true
gdfmt_workspace.workspace = true
gdfmt_parser.workspace = true
gdfmt_syntax.workspace = true
lsp-server = "=0.7.9"
crossbeam-channel = "0.5"
url = "2.5"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "gdfmt"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
