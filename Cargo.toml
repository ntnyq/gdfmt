[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ntnyq/gdfmt"

[workspace.dependencies]
gdfmt_text = { path = "crates/gdfmt_text", version = "=0.1.0-alpha.3" }
gdfmt_syntax = { path = "crates/gdfmt_syntax", version = "=0.1.0-alpha.3" }
gdfmt_parser = { path = "crates/gdfmt_parser", version = "=0.1.0-alpha.3" }
gdfmt_formatter = { path = "crates/gdfmt_formatter", version = "=0.1.0-alpha.3" }
gdfmt = { path = "crates/gdfmt", version = "=0.1.0-alpha.3" }
gdfmt_config = { path = "crates/gdfmt_config", version = "=0.1.0-alpha.3" }
gdfmt_workspace = { path = "crates/gdfmt_workspace", version = "=0.1.0-alpha.3" }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
ec4rs = { version = "1.2", features = ["track-source"] }
jsonschema = { version = "0.33", default-features = false }
rowan = "0.16"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
strip = true
