packages:
  - docs
  - packages/*
  - editors/*

allowBuilds:
  esbuild: true
  '@playwright/browser-chromium': false
  '@vscode/vsce-sign': false

minimumReleaseAge: 0
pmOnFail: warn
shellEmulator: true
ignoreWorkspaceRootCheck: true

# Native release artifacts are built and tested in isolated consumers.
ignoredOptionalDependencies:
  - '@gdfmt/*'
