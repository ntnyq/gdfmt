name: npm artifacts (no publish)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm release:check
      - run: pnpm test:release

  native:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.0.0']
        platform:
          - { os: macos-15, id: darwin-arm64, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, id: darwin-x64, triple: x86_64-apple-darwin }
          - {
              os: windows-2025,
              id: win32-x64-msvc,
              triple: x86_64-pc-windows-msvc,
            }
          - {
              os: ubuntu-24.04,
              id: linux-x64-gnu,
              triple: x86_64-unknown-linux-gnu,
            }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.platform.triple }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:trials
      - run: pnpm test:npm ${{ matrix.platform.triple }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: npm-${{ matrix.platform.id }}-${{ matrix.node }}
          overwrite: true
          path: target/npm/artifacts/${{ matrix.platform.id }}/
          if-no-files-found: error

  musl:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.0.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and install the final package on Alpine musl
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e RUSTFLAGS='-C target-feature=-crt-static' \
            "node:${NODE_VERSION}-alpine" sh -ec '
              apk add --no-cache build-base curl bash git libgcc
              git config --global --add safe.directory /workspace
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.0 --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              npm install --global pnpm@12.14.0 --ignore-scripts
              pnpm install --frozen-lockfile
              pnpm typecheck
              pnpm test:npm x86_64-unknown-linux-musl
            '
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: npm-linux-x64-musl-${{ matrix.node }}
          overwrite: true
          path: target/npm/artifacts/linux-x64-musl/
          if-no-files-found: error

  parity:
    needs: [native, musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: npm-*
          path: target/npm-ci
      - run: pnpm verify:npm
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-verified-matrix
          overwrite: true
          path: target/npm-ci/verified.json
          if-no-files-found: error
