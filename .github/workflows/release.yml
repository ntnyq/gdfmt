name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected version tag (requires RELEASE_ENABLED=true)
        type: boolean
        default: false

permissions:
  contents: read

# Serialize versions as well as retries so an older run cannot race a promotion.
concurrency:
  group: registry-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - name: Validate version and release source
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUEST_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            pnpm release:check --tag "$GITHUB_REF_NAME"
            test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          else
            pnpm release:check
            if [ "$REQUEST_PUBLISH" = true ]; then
              echo 'Publishing requires a version tag selected as the workflow ref.' >&2
              exit 1
            fi
          fi
          git diff --exit-code
          if [ "$RELEASE_ENABLED" != true ]; then
            echo '::notice::Registry writes are disabled. Set the repository variable RELEASE_ENABLED=true after platform setup.'
          fi

  rust:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  npm:
    needs: preflight
    uses: ./.github/workflows/npm.yml

  freeze:
    needs: [preflight, rust, npm]
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: npm-*
          path: target/npm-ci
      - name: Package and compile the public Rust crates without publishing
        run: cargo package --workspace --exclude gdfmt_napi --exclude xtask --registry crates-io --locked
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@v7.0.2
        id: bundle
        with:
          name: release-artifacts-${{ github.run_attempt }}
          path: target/release/
          if-no-files-found: error
          retention-days: 30

  publish-crates:
    needs: [preflight, freeze]
    if: vars.RELEASE_ENABLED == 'true' && github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.freeze.outputs.artifact-id }}
          merge-multiple: true
          path: target/release
      - run: pnpm release:check --tag "$GITHUB_REF_NAME"
      - run: pnpm release:publish:crates
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: pnpm release:publish:crates --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Verify the registry-installed Rust CLI
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cargo install gdfmt_cli --version "=$RELEASE_VERSION" --locked --root "$RUNNER_TEMP/gdfmt-rust"
          test "$("$RUNNER_TEMP/gdfmt-rust/bin/gdfmt" --version)" = "gdfmt $RELEASE_VERSION"

  publish-npm:
    needs: [preflight, freeze, publish-crates]
    if: vars.RELEASE_ENABLED == 'true' && github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.freeze.outputs.artifact-id }}
          merge-multiple: true
          path: target/release
      - run: pnpm release:check --tag "$GITHUB_REF_NAME"
      - run: pnpm release:publish:npm --execute

  github-release:
    needs: [preflight, freeze, publish-crates, publish-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.freeze.outputs.artifact-id }}
          merge-multiple: true
          path: release
      - name: Create the release only after both registries succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            args=(--verify-tag --generate-notes)
            if [ "$RELEASE_CHANNEL" = next ]; then args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release/npm/* release/crates/* --clobber
