name: WASM and editor artifacts (no publish)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - run: pnpm install --frozen-lockfile
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:wasm
      - run: pnpm typecheck:docs
      - run: pnpm test:docs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-wasm
          path: |
            target/wasm/*.tgz
            target/wasm/acceptance.json
          if-no-files-found: error

  vscode-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - run: pnpm install --frozen-lockfile
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck:vscode:web
      - run: pnpm test:vscode:web:unit
      - run: pnpm test:vscode:web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vscode-web
          path: target/editors/web/
          if-no-files-found: error

  vscode:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04, id: linux-x64-gnu }
          - { os: macos-15, id: darwin-arm64 }
          - { os: macos-15-intel, id: darwin-x64 }
          - { os: windows-2025, id: win32-x64-msvc }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.0.0'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:vscode
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:vscode
        env:
          GDFMT_TEST_GODOT_TOOLS: '1'
      - if: runner.os != 'Linux'
        run: pnpm test:vscode
        env:
          GDFMT_DEBUG_SAVE: ${{ matrix.platform.id == 'darwin-arm64' && '1' || '0' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vscode-${{ matrix.platform.id }}
          path: target/editors/${{ matrix.platform.id }}/
          if-no-files-found: error

  vscode-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Package Alpine native server and VSIX
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:24.0.0-alpine sh -ec '
            apk add --no-cache build-base curl bash git libgcc
            git config --global --add safe.directory /workspace
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.0 --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            npm install --global pnpm@12.15.0 --ignore-scripts
            pnpm install --frozen-lockfile
            pnpm package:vscode x86_64-unknown-linux-musl
          '
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vscode-linux-x64-musl
          path: target/editors/linux-x64-musl/
          if-no-files-found: error
