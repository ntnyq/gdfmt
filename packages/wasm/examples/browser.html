<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>gdfmt WASM</title>
  <textarea id="source" rows="8" cols="60">var value=1</textarea>
  <button id="format" disabled>Format</button>
  <pre id="result"></pre>
  <script type="module">
    import { createFormatter } from '../dist/index.mjs'
    const formatter = await createFormatter()
    const button = document.querySelector('#format')
    button.disabled = false
    button.addEventListener('click', () => {
      const result = formatter.formatSync(
        document.querySelector('#source').value,
      )
      document.querySelector('#result').textContent =
        result.output ?? JSON.stringify(result.diagnostics, null, 2)
    })
  </script>
</html>
